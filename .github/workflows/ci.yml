name: ci

on:
  workflow_dispatch:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release

  sanitizer:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build/sanitize -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DPREDICTFUN_BUILD_TESTS=ON
          -DPREDICTFUN_BUILD_TOOLS=OFF
          -DPREDICTFUN_BUILD_FUZZERS=ON
          -DPREDICTFUN_WARNINGS_AS_ERRORS=ON
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build sanitizer matrix
        run: cmake --build build/sanitize
      - name: Run sanitizer matrix
        run: ctest --test-dir build/sanitize --output-on-failure
      - name: Run deterministic libFuzzer smoke corpus
        run: ./build/sanitize/predictfun_codec_fuzz -runs=2000 -max_len=4096
